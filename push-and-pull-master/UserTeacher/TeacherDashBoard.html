<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe - Teacher Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TeacherDashBoard.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true" focusable="false">
      <symbol id="teacher-icon-dashboard" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-events" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3" />
        </g>
      </symbol>
      <symbol id="teacher-icon-calendar" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-notifications" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
          <path d="M8 16a2 2 0 0 0 4 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-profile" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="6.5" r="3" />
          <path d="M4 17a6 6 0 0 1 12 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-logout" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8M13 13.5 17 10l-4-3.5M7.5 10H17" />
        </g>
      </symbol>
      <symbol id="teacher-icon-menu" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M3 5h14M3 10h14M3 15h14" />
        </g>
      </symbol>
      <symbol id="teacher-icon-chevron" viewBox="0 0 20 20">
        <path d="m7 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </symbol>
    </svg>

    <div class="teacher-app" id="teacherDashboard">
      <div class="sidebar-scrim" id="sidebarScrim" hidden></div>
      <aside class="teacher-sidebar" id="teacherSidebar" aria-label="Teacher navigation">
        <div class="sidebar-brand">
          <span class="brand-mark">RV</span>
          <span class="brand-copy"><strong>RecoVibe</strong><small>PUP Biñan Campus</small></span>
          <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Close navigation">×</button>
        </div>
        <nav class="primary-nav" aria-label="Primary">
          <a class="nav-link is-active" href="TeacherDashBoard.html" aria-current="page">
            <svg aria-hidden="true"><use href="#teacher-icon-dashboard" /></svg><span>Dashboard</span>
          </a>
          <a class="nav-link" href="TeacherAllEvent.html">
            <svg aria-hidden="true"><use href="#teacher-icon-events" /></svg><span>All Events</span>
          </a>
          <a class="nav-link" href="TeacherCalendar.html">
            <svg aria-hidden="true"><use href="#teacher-icon-calendar" /></svg><span>Calendar</span>
          </a>
          <a class="nav-link" href="TeacherNotification.html">
            <svg aria-hidden="true"><use href="#teacher-icon-notifications" /></svg><span>Notifications</span>
            <span class="nav-badge" id="navNotifBadge" aria-label="No unread notifications" hidden></span>
          </a>
          <a class="nav-link" href="TeacherProfile.html">
            <svg aria-hidden="true"><use href="#teacher-icon-profile" /></svg><span>Profile</span>
          </a>
        </nav>
        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="userAvatar">T</div>
            <div class="user-meta"><strong id="userName">Teacher</strong><span>Teacher</span></div>
          </div>
          <a class="nav-link logout-link" href="TeacherLogin.html" id="teacherLogout">
            <svg aria-hidden="true"><use href="#teacher-icon-logout" /></svg><span>Logout</span>
          </a>
        </div>
      </aside>

      <main class="teacher-main">
        <header class="page-header">
          <div class="header-copy">
            <button class="menu-toggle" id="sidebarToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="teacherSidebar">
              <svg aria-hidden="true"><use href="#teacher-icon-menu" /></svg>
            </button>
            <div>
              <h1 id="teacherGreeting">Good morning, there</h1>
              <p id="teacherSubtitle" aria-live="polite">No events coming up</p>
            </div>
          </div>
          <time class="today-date" id="teacherToday"></time>
        </header>

        <div class="dashboard-grid">
          <section class="panel coming-up-panel" aria-labelledby="comingUpHeading">
            <div class="panel-heading">
              <h2 id="comingUpHeading">Coming up</h2>
              <a class="panel-link" href="TeacherAllEvent.html">See all events</a>
            </div>
            <div class="panel-body event-list" id="comingUpContent" aria-live="polite">
              <div class="skeleton-row" aria-hidden="true"></div>
              <div class="skeleton-row" aria-hidden="true"></div>
            </div>
          </section>

          <div class="right-column">
            <section class="panel calendar-panel" aria-labelledby="calendarHeading">
              <div class="panel-heading calendar-heading">
                <h2 id="calendarHeading">Calendar</h2>
                <div class="calendar-controls">
                  <button class="month-button" id="calendarPrevious" type="button" aria-label="Previous month">
                    <svg aria-hidden="true"><use href="#teacher-icon-chevron" /></svg>
                  </button>
                  <strong id="calendarMonthLabel"></strong>
                  <button class="month-button next-month" id="calendarNext" type="button" aria-label="Next month">
                    <svg aria-hidden="true"><use href="#teacher-icon-chevron" /></svg>
                  </button>
                </div>
              </div>
              <div class="panel-body" id="calendarContent" aria-live="polite">
                <div class="calendar-skeleton" aria-hidden="true"></div>
              </div>
            </section>

            <section class="panel notifications-panel" aria-labelledby="notificationsHeading">
              <div class="panel-heading">
                <div class="notification-title">
                  <h2 id="notificationsHeading">Recent notifications</h2>
                  <span class="unread-pill" id="unreadCount" hidden></span>
                </div>
                <a class="panel-link" href="TeacherNotification.html">See all</a>
              </div>
              <div class="panel-body notification-list" id="notificationsContent" aria-live="polite">
                <div class="skeleton-notification" aria-hidden="true"></div>
                <div class="skeleton-notification" aria-hidden="true"></div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="TeacherEventVisibility.js"></script>
    <script type="module" src="TeacherDashBoard.js"></script>
  </body>
</html>
